[package]
name = "metrics-sdk"
description = "Typed counters and gauges over soil:metrics, for Spore guests"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"
publish = false

# Its own workspace, like every guest crate here: a Spore links this crate but
# must not inherit the repository's host-side build profile or lockfile.
[workspace]

[dependencies]
wit-bindgen = "0.41"
