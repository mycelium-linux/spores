[package]
name = "spore-hue"
description = "Philips Hue CLI: groups, lights, scenes and colour over the local bridge API"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# rlib for the native tests, cdylib for the wasm32-wasip2 component.
crate-type = ["cdylib", "rlib"]

[dependencies]
cli-http = { path = "../cli-http" }
hue-client = { path = "../hue-client" }
serde_json = "1"

# The component's own half. These are used only inside the wasm32-wasip2 build
# (src/guest.rs and the wasm-gated half of src/lib.rs), so they are declared for
# that target alone: host clippy was refusing the tree with "unused dependency"
# for code it never compiles.
[target.'cfg(target_family = "wasm")'.dependencies]
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.57"

# wit-bindgen emits unsafe shims and export_name; isolate that to this Spore.
[lints.rust]
unsafe_code = "allow"
