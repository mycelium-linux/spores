<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scribe</title>
<style>
:root{--bg:#faf8f4;--panel:#f3efe7;--ink:#1d1b18;--muted:#7b7266;--line:#e4ddd2;--accent:#2f6f56;--accent-soft:#e3eee7}
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
header{display:flex;align-items:center;gap:12px;height:58px;padding:0 22px;border-bottom:1px solid var(--line)}
.brand{font-family:ui-serif,Georgia,serif;font-size:23px;letter-spacing:-.03em}.brand b{color:var(--accent)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.13em;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:2px 7px}
header .spacer{flex:1}button{font:inherit;cursor:pointer;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:7px;padding:6px 10px}button:hover{background:#f0ebe2}
main{display:grid;grid-template-columns:238px minmax(0,1fr) 300px;height:calc(100vh - 58px)}
aside{overflow:auto}.chats{border-right:1px solid var(--line);padding:10px 8px}
.list-title{color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.14em;padding:0 7px 7px}
.chat{display:block;width:100%;text-align:left;border:0;border-radius:6px;padding:5px 7px;margin:0;background:transparent}
.chat:hover{background:#f0ebe2}.chat.active{background:#ece6dc}
.chat .name{font-weight:560;font-size:13px;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chat .when{font-size:10px;color:var(--muted);margin-top:1px}
.searchbar{padding:0 7px 10px;border-bottom:1px solid var(--line);margin-bottom:4px}.searchbar input{width:100%;font:inherit;font-size:12px;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink)}.searchbar .dates{display:flex;align-items:center;gap:4px;margin-top:6px}.searchbar .dates input{font-size:10px;padding:4px}.searchbar .dates button{font-size:10px;padding:4px 6px;flex:none}.group-header{display:flex;justify-content:space-between;align-items:center;width:100%;border:0;background:transparent;font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;padding:12px 7px 5px;position:sticky;top:0;background:var(--bg);cursor:pointer}.group-header:hover{color:var(--ink)}.group-header span{font-size:9px;letter-spacing:0}.load-more{display:block;width:calc(100% - 14px);margin:10px 7px;font-size:11px;padding:7px;border-radius:6px}.loading{display:flex;justify-content:center;padding:14px}.loading.hidden{display:none}.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.date-header{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.13em;padding:12px 7px 5px;position:sticky;top:0;background:var(--bg)}
.center{padding:30px 38px 60px;overflow:auto}
h1{font-family:ui-serif,Georgia,serif;font-size:34px;line-height:1.14;letter-spacing:-.035em;margin:0 0 7px;max-width:900px}
.meta{color:var(--muted);font-size:12px;margin-bottom:28px}.meta .mini{font-size:11px;padding:2px 7px;margin-left:8px;border-radius:5px}
.summary{font-size:15px;line-height:1.68;max-width:860px;padding-bottom:24px;border-bottom:1px solid var(--line)}.summary-tools{display:flex;gap:6px;margin:0 0 12px}.summary-tools .mini{font-size:11px;padding:3px 8px;border-radius:5px}.summary-tools .mini.active{background:var(--accent-soft);color:var(--accent);border-color:#c7dbcf}
.summary h1,.summary h2,.summary h3{font-family:ui-serif,Georgia,serif;letter-spacing:-.02em;margin:18px 0 7px;line-height:1.25}.summary h1{font-size:23px}.summary h2{font-size:18px;text-transform:none}.summary h3{font-size:16px;text-transform:none}.summary p{margin:0 0 11px}.summary ul,.summary ol{margin:0 0 12px;padding-left:22px}.summary li{margin:3px 0}.summary code{background:#eee8de;border-radius:4px;padding:1px 4px;font-size:.92em}.summary a{color:var(--accent)}
h2{font-size:10px;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);margin:30px 0 8px}
.turn{padding:10px 0;border-bottom:1px solid #eee8de;cursor:pointer}.turn:hover{background:#f7f3ec}
.speaker{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin-bottom:4px;display:flex;align-items:center;gap:6px}.speaker .dot{width:6px;height:6px;border-radius:50%;display:inline-block;flex:none}.speaker-name{font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;border:0;background:transparent;padding:0;cursor:pointer}.speaker-name:hover{text-decoration:underline;text-underline-offset:3px}.turn+.turn{margin-top:2px}.text{white-space:pre-wrap;max-width:820px}
.actions{border-left:1px solid var(--line);padding:16px 16px 30px;background:var(--panel)}
.actions h2{margin:4px 0 12px}
.action{padding:11px 0;border-bottom:1px solid var(--line)}
.action:last-child{border-bottom:0}
.action .title{font-weight:560;line-height:1.35}
.action .quote{color:var(--muted);font-size:12px;margin-top:5px;padding-left:9px;border-left:2px solid var(--accent)}
.action .who{font-size:11px;color:var(--muted);margin-top:6px}
.pill{display:inline-block;font-size:10px;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:1px 6px;margin-left:4px}
.empty{color:var(--muted);padding:40px 4px;font-size:13px}
.error{color:#8c2f2f;background:#f9e9e6;border:1px solid #efd2cc;border-radius:8px;padding:10px 12px}
@media(max-width:900px){main{grid-template-columns:220px minmax(0,1fr)}.actions{display:none}}body.shared .chats{display:none}body.shared main{grid-template-columns:minmax(0,1fr) 320px}body.shared .center{max-width:980px;margin:0 auto;width:100%}
@media(max-width:640px){main{display:block;height:auto}.chats{border-right:0;border-bottom:1px solid var(--line);max-height:220px}.center{padding:22px 18px}.actions{display:block;border-left:0;border-top:1px solid var(--line)}}
</style>
</head>
<body>
<header>
  <div class="brand">Scribe<b>.</b></div><span class="tag">captures</span>
  <div class="spacer"></div>
</header>
<main>
  <aside class="chats">
    <div class="list-title">Chats</div>
    <div class="searchbar">
      <input id="search" placeholder="Search captures…" autocomplete="off">
      <div class="dates"><input id="from" type="date" title="From date"><span>–</span><input id="to" type="date" title="To date"><button id="search-btn">Search</button></div>
    </div>
    <div id="loading" class="loading hidden"><span class="spinner"></span></div>
    <div id="list"></div>
  </aside>
  <section class="center" id="detail"><div class="empty">Choose a capture.</div></section>
  <aside class="actions">
    <h2>Action items</h2>
    <div id="actions"><div class="empty">No capture selected.</div></div>
  </aside>
</main>
<script>
const list = document.getElementById('list');
const detail = document.getElementById('detail');
const actionsEl = document.getElementById('actions');
let selected = null;
const shared = location.pathname === '/c' || location.pathname.startsWith('/c/');

const esc = (value) => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shortTitle = (value, max = 64) => {
  let text = String(value ?? '').replace(/^#+\s*/, '').replace(/^Overview:\s*/i, '').trim();
  text = text.split('. ')[0].replace(/\.$/, '');
  if (text.length <= max) return text;
  let cut = text.lastIndexOf(' ', max);
  if (cut < max * 0.6) cut = max;
  return text.slice(0, cut).replace(/[\s,;:.\-—]+$/, '') + '…';
};
const canonicalSpeaker = (raw) => {
  if (raw == null) return 'Speaker';
  const text = String(raw);
  if (text === 'You') return 'You';
  if (/^\d+$/.test(text)) return `SPEAKER_${text.padStart(2, '0')}`;
  return text;
};
const speakerName = (speaker) => {
  if (speaker == null) return 'Speaker';
  if (typeof speaker === 'number') return `Speaker ${speaker}`;
  const match = String(speaker).match(/(\d+)/);
  return match ? `Speaker ${Number(match[1])}` : String(speaker);
};
const speakerLabel = (segment) => segment?.is_user ? 'You' : speakerName(segment?.speaker);
const displaySpeaker = (capture, raw) => {
  const key = canonicalSpeaker(raw);
  const mapped = capture?.speakers?.[key]?.name;
  return mapped || (key === 'You' ? 'You' : speakerName(key));
};
const overrideFor = (capture, start, end) => {
  let best = null;
  let bestOverlap = 0;
  for (const item of capture?.overrides || []) {
    const overlap = Math.min(end, Number(item.end)) - Math.max(start, Number(item.start));
    if (overlap > bestOverlap) {
      best = item;
      bestOverlap = overlap;
    }
  }
  return best;
};
const speakerColor = (label) => {
  let hash = 0;
  for (const ch of String(label)) hash = ((hash << 5) - hash + ch.charCodeAt(0)) | 0;
  return `hsl(${Math.abs(hash) % 360} 35% 42%)`;
};

let cards = [];
let offset = 0;
let total = 0;
let hasMore = true;
let loading = false;
let searchQuery = '';
const collapsedGroups = new Set();

const relativeGroup = (ms) => {
  const now = new Date();
  const today = new Date(now.getFullYear(), now.getMonth(), now.getDate()).getTime();
  const day = 86400000;
  if (!ms || ms >= today) return 'Today';
  if (ms >= today - day) return 'Yesterday';
  if (ms >= today - 7 * day) return 'Last 7 days';
  if (ms >= today - 30 * day) return 'Last 30 days';
  return 'Older';
};

function setLoading(on) {
  document.getElementById('loading')?.classList.toggle('hidden', !on);
}

function renderList() {
  const clock = (ms) => ms ? new Date(ms).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }) : '';
  const groups = new Map();
  for (const item of cards) {
    const group = relativeGroup(item.started_at_ms);
    if (!groups.has(group)) groups.set(group, []);
    groups.get(group).push(item);
  }
  let html = '';
  for (const [group, items] of groups) {
    const open = !collapsedGroups.has(group);
    html += `<button class="group-header" data-group="${esc(group)}">${esc(group)}<span>${items.length}</span></button>`;
    if (open) {
      html += items.map(item => `<button class="chat ${item.path === selected ? 'active' : ''}" data-path="${esc(item.path)}">
        <div class="name">${esc(shortTitle(item.title))}</div>
        <div class="when">${esc(clock(item.started_at_ms))}</div>
      </button>`).join('');
    }
  }
  if (hasMore) html += '<button class="load-more" id="load-more">Load more</button>';
  list.innerHTML = html || '<div class="empty">No captures found.</div>';
  list.querySelectorAll('.chat').forEach(button => button.addEventListener('click', () => loadCapture(button.dataset.path)));
  list.querySelectorAll('.group-header').forEach(button => button.addEventListener('click', () => {
    const group = button.dataset.group;
    if (collapsedGroups.has(group)) collapsedGroups.delete(group);
    else collapsedGroups.add(group);
    renderList();
  }));
  document.getElementById('load-more')?.addEventListener('click', () => loadList(false));
}

async function loadList(reset = false) {
  if (loading) return;
  if (reset) {
    cards = [];
    offset = 0;
    hasMore = true;
  }
  loading = true;
  setLoading(true);
  try {
    const from = document.getElementById('from')?.value || '';
    const to = document.getElementById('to')?.value || '';
    const params = new URLSearchParams();
    if (from) params.set('from', from);
    if (to) params.set('to', to);
    let url;
    if (searchQuery) {
      params.set('q', searchQuery);
      url = `/api/search?${params}`;
    } else {
      params.set('offset', String(offset));
      params.set('limit', '40');
      url = `/api/captures?${params}`;
    }
    const response = await fetch(url);
    if (!response.ok) throw new Error(await response.text());
    const body = await response.json();
    cards = cards.concat(body.captures || []);
    offset = cards.length;
    total = Number(body.total || cards.length);
    hasMore = Boolean(body.next);
    renderList();
    if (reset && !selected && cards.length) loadCapture(cards[0].path);
  } finally {
    loading = false;
    setLoading(false);
  }
}

const runSearch = () => {
  searchQuery = document.getElementById('search')?.value.trim() || '';
  selected = null;
  loadList(true).catch(showError);
};

async function loadCapture(path) {
  selected = path;
  list.querySelectorAll('.chat').forEach(button => button.classList.toggle('active', button.dataset.path === path));
  detail.innerHTML = '<div class="empty">Loading…</div>';
  try {
    const response = await fetch(`/api/capture?path=${encodeURIComponent(path)}`);
    if (!response.ok) throw new Error(await response.text());
    render(await response.json());
  } catch (error) {
    detail.innerHTML = `<div class="error">${esc(error.message)}</div>`;
    actionsEl.innerHTML = '';
  }
}

function metaLine(capture) {
  const start = capture.started_at_ms ? new Date(capture.started_at_ms) : null;
  const end = capture.ended_at_ms ? new Date(capture.ended_at_ms) : null;
  if (!start) return '';
  const date = start.toLocaleDateString([], { weekday: 'long', month: 'long', day: 'numeric' });
  const time = start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  const mins = end ? Math.max(0, Math.round((end - start) / 60000)) : 0;
  return `${date} · ${time}${mins ? ` · ${mins} min` : ''}`;
}

function inlineMarkdown(text) {
  return text
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`]+)`/g, '<code>$1</code>')
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noreferrer">$1</a>');
}

function markdown(source) {
  const lines = String(source || '').split(/\r?\n/);
  const out = [];
  let list = null;
  let paragraph = [];
  const flushParagraph = () => {
    if (paragraph.length) { out.push(`<p>${inlineMarkdown(esc(paragraph.join(' ')))}</p>`); paragraph = []; }
  };
  const closeList = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    if (!line.trim()) { flushParagraph(); closeList(); continue; }
    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    if (heading) { flushParagraph(); closeList(); const n = heading[1].length; out.push(`<h${n}>${inlineMarkdown(esc(heading[2]))}</h${n}>`); continue; }
    const bullet = line.match(/^[-*]\s+(.*)$/);
    if (bullet) {
      flushParagraph();
      if (list !== 'ul') { closeList(); out.push('<ul>'); list = 'ul'; }
      out.push(`<li>${inlineMarkdown(esc(bullet[1]))}</li>`);
      continue;
    }
    const numbered = line.match(/^\d+\.\s+(.*)$/);
    if (numbered) {
      flushParagraph();
      if (list !== 'ol') { closeList(); out.push('<ol>'); list = 'ol'; }
      out.push(`<li>${inlineMarkdown(esc(numbered[1]))}</li>`);
      continue;
    }
    closeList();
    paragraph.push(line);
  }
  flushParagraph(); closeList();
  return out.join('');
}

function paragraphs(text) {
  if (text.length <= 460) return [text];
  const chunks = [];
  let rest = text.trim();
  while (rest.length > 460) {
    let cut = rest.lastIndexOf('. ', 460);
    if (cut < 160) cut = rest.lastIndexOf(' ', 460);
    if (cut < 160) cut = 460;
    chunks.push(rest.slice(0, cut + (rest[cut] === '.' ? 1 : 0)).trim());
    rest = rest.slice(cut + (rest[cut] === '.' ? 1 : 0)).trim();
  }
  if (rest) chunks.push(rest);
  return chunks;
}

function render(capture) {
  const actions = Array.isArray(capture.actions) ? capture.actions : [];
  const segments = capture.transcript?.segments || [];
  const words = capture.transcript?.words || [];
  const turns = [];
  if (segments.length) {
    for (const segment of segments) {
      const speakerKey = segment.is_user ? 'You' : canonicalSpeaker(segment.speaker);
      const speaker = displaySpeaker(capture, speakerKey);
      const text = (segment.text || '').trim();
      if (!text) continue;
      const start = Number(segment.start ?? 0);
      const end = Number(segment.end ?? start);
      const pieces = paragraphs(text);
      for (let index = 0; index < pieces.length; index++) {
        const piece = pieces[index];
        const last = turns[turns.length - 1];
        const pause = last ? start - last.end : Infinity;
        if (index > 0 || !last || last.speaker !== speaker || pause > 1.4) {
          turns.push({speaker, speakerKey, text: piece, start, end});
        } else {
          last.text += ' ' + piece;
          last.end = Math.max(last.end, end);
        }
      }
    }
  } else {
    for (const word of words) {
      const speakerKey = word.is_user ? 'You' : canonicalSpeaker(word.speaker);
      const speaker = displaySpeaker(capture, speakerKey);
      const token = word.word ?? '';
      if (!token) continue;
      const start = Number(word.start ?? 0);
      const end = Number(word.end ?? start);
      const last = turns[turns.length - 1];
      const pause = last ? start - last.end : Infinity;
      if (!last || last.speaker !== speaker || pause > 1.8) turns.push({speaker, speakerKey, text: token, start, end});
      else {
        if (/^[,.;:!?%\)\]]/.test(token)) last.text += token;
        else last.text += ' ' + token;
        last.end = Math.max(last.end, end);
      }
    }
  }
  for (const turn of turns) {
    const correction = overrideFor(capture, turn.start, turn.end);
    if (correction?.name) turn.speaker = correction.name;
  }
  const transcript = turns.length
    ? turns.map(turn => `<div class="turn" data-speaker="${esc(turn.speakerKey)}" data-start="${turn.start}" data-end="${turn.end}" title="Click to correct this line's speaker"><div class="speaker"><i class="dot" style="background:${speakerColor(turn.speaker)}"></i><button class="speaker-name">${esc(turn.speaker)}</button></div><div class="text">${esc(turn.text)}</div></div>`).join('')
    : `<div class="empty">${esc(capture.transcript?.text || 'No word timestamps in this transcript.')}</div>`;
  const named = Object.entries(capture.speakers || {}).filter(([, value]) => value?.name);
  const tools = shared ? '' : [
    named.length >= 1 ? `<button class="mini" id="voicefix-lines">Auto-fix lines</button>` : '',
    named.length >= 2 ? `<button class="mini" id="swap-speakers">Swap names</button><button class="mini" id="relearn-speakers">Relearn voices</button>` : '',
  ].join('');
  const designSummary = capture.design_summary || '';
  const summaryTools = `<div class="summary-tools">
    <button class="mini" id="copy-llm">Copy for LLM</button>
    ${shared ? '' : `<button class="mini" id="copy-link">Copy link</button>`}
    ${designSummary ? `<button class="mini" id="summary-view">Summary</button><button class="mini" id="design-view">Design doc</button>` : `<button class="mini" id="design-view">Design doc</button>`}
  </div>`;
  detail.innerHTML = `
    <h1>${esc(shortTitle(capture.title, 90))}</h1>
    <div class="meta">${esc(metaLine(capture))}${tools}</div>
    ${summaryTools}
    <div id="summary-body" class="summary"></div>
    <h2>Transcript</h2>
    ${transcript}`;
  let summaryView = 'summary';
  const summaryText = () => summaryView === 'design' ? designSummary : (capture.summary || 'No summary yet.');
  const renderSummaryBody = () => {
    document.getElementById('summary-body').innerHTML = markdown(summaryText().replace(/^#\s+.*\n+/, ''));
    document.getElementById('summary-view')?.classList.toggle('active', summaryView === 'summary');
    document.getElementById('design-view')?.classList.toggle('active', summaryView === 'design');
  };
  renderSummaryBody();
  document.getElementById('summary-view')?.addEventListener('click', () => { summaryView = 'summary'; renderSummaryBody(); });
  document.getElementById('design-view')?.addEventListener('click', async () => {
    if (designSummary) { summaryView = 'design'; renderSummaryBody(); return; }
    const response = await fetch(`/api/restyle?path=${encodeURIComponent(capture.path)}`, { method: 'POST' });
    if (response.ok) {
      alert('Queued a technical design-doc rewrite.');
      setTimeout(() => loadCapture(capture.path), 8000);
    }
  });
  document.getElementById('copy-link')?.addEventListener('click', async () => {
    const url = `${location.origin}/c/${encodeURIComponent(capture.id)}`;
    try { await navigator.clipboard.writeText(url); alert(url); } catch (error) { alert(url); }
  });
  document.getElementById('copy-llm')?.addEventListener('click', async () => {
    const people = [...new Set(Object.values(capture.speakers || {}).map(value => value?.name).filter(Boolean))];
    const actionLines = actions.map(action => `- [${action.kind || 'action'}] ${action.title || action.quote || 'Untitled'}${action.owner ? ` — ${displaySpeaker(capture, action.owner)}` : ''}${action.due_at ? ` (${action.due_at})` : ''}`).join('\n');
    const transcriptLines = turns.map(turn => `${turn.speaker}: ${turn.text}`).join('\n');
    const text = `# ${shortTitle(capture.title, 90)}\n\n${metaLine(capture)}${people.length ? `\nParticipants: ${people.join(', ')}` : ''}\n\n## ${summaryView === 'design' ? 'Design doc' : 'Summary'}\n${summaryText()}\n\n## Action items\n${actionLines || 'None captured.'}\n\n## Transcript\n${transcriptLines || capture.transcript?.text || ''}`;
    try {
      await navigator.clipboard.writeText(text);
      const button = document.getElementById('copy-llm');
      button.textContent = 'Copied';
      setTimeout(() => { button.textContent = 'Copy for LLM'; }, 1500);
    } catch (error) {
      alert(`Copy failed: ${error.message}`);
    }
  });
  detail.querySelectorAll('.turn[data-speaker]').forEach(turn => {
    turn.addEventListener('click', async () => {
      const key = turn.dataset.speaker;
      const start = Number(turn.dataset.start);
      const end = Number(turn.dataset.end);
      const name = prompt(`Name for ${displaySpeaker(capture, key)}`, '');
      if (!name || !name.trim()) return;
      const bulk = confirm(`Apply “${name.trim()}” to every ${displaySpeaker(capture, key)} line in this capture?\n\nOK = all matching lines. Cancel = only this line.`);
      let url = `/api/speaker?path=${encodeURIComponent(capture.path)}&speaker=${encodeURIComponent(key)}&name=${encodeURIComponent(name.trim())}`;
      if (!bulk) url += `&scope=line&start=${start}&end=${end}`;
      const response = await fetch(url, { method: 'POST' });
      if (response.ok) loadCapture(capture.path);
    });
  });
  document.getElementById('voicefix-lines')?.addEventListener('click', async () => {
    const response = await fetch(`/api/voicefix?path=${encodeURIComponent(capture.path)}`, { method: 'POST' });
    if (response.ok) {
      alert('Queued line-by-line voice ID. Reload in a few seconds.');
      setTimeout(() => loadCapture(capture.path), 6000);
    }
  });
  document.getElementById('swap-speakers')?.addEventListener('click', async () => {
    const entries = Object.entries(capture.speakers || {}).filter(([, value]) => value?.name);
    if (entries.length < 2) return;
    const [a, av] = entries[0];
    const [b, bv] = entries[1];
    if (!confirm(`Swap ${av.name} and ${bv.name} everywhere in this capture?`)) return;
    const response = await fetch(`/api/swap?path=${encodeURIComponent(capture.path)}&a=${encodeURIComponent(a)}&b=${encodeURIComponent(b)}`, { method: 'POST' });
    if (response.ok) loadCapture(capture.path);
  });
  document.getElementById('relearn-speakers')?.addEventListener('click', async () => {
    const response = await fetch(`/api/relearn?path=${encodeURIComponent(capture.path)}`, { method: 'POST' });
    if (response.ok) alert('Queued both named voices for enrollment. The enrich worker will update templates.');
  });
  actionsEl.innerHTML = actions.length ? actions.map(action => `
    <div class="action">
      <div class="title">${esc(action.title || action.quote || 'Untitled action')}</div>
      ${action.quote ? `<div class="quote">“${esc(action.quote)}”</div>` : ''}
      <div class="who">${esc(displaySpeaker(capture, action.owner))}${action.due_at ? ` · ${esc(action.due_at)}` : ''}</div>
    </div>`).join('') : '<div class="empty">No action items extracted.</div>';
}

function showError(error) { detail.innerHTML = `<div class="error">${esc(error.message)}</div>`; }
if (shared) {
  document.body.classList.add('shared');
  const id = decodeURIComponent(location.pathname.split('/').filter(Boolean).pop() || '');
  fetch(`/api/capture?id=${encodeURIComponent(id)}`)
    .then(response => response.ok ? response.json() : Promise.reject(new Error(response.statusText)))
    .then(capture => { selected = capture.path; render(capture); })
    .catch(showError);
} else {
  document.getElementById('search-btn')?.addEventListener('click', runSearch);
  document.getElementById('search')?.addEventListener('keydown', event => { if (event.key === 'Enter') runSearch(); });
  loadList(true).catch(showError);
}
</script>
</body>
</html>
