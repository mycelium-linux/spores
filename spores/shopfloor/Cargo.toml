[package]
name = "shopfloor"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"
publish = false

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.41"
