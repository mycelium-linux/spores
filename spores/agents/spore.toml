schema = 1

[spore]
id = "dev.mycelium.agents"
name = "agents"
version = "0.1.0"
license = "MIT"
summary = "One soil:agents surface over every agent adapter"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"

[module]
path = "module.wasm"

[[commands]]
name = "agents-core"
summary = "composed agent aggregator"
module = "module.wasm"

[launch]
default = "native"
surfaces = ["native"]

# The aggregator imports adapter Spores; it does not read records itself.
[grants]
"mycelium:theseus-agents" = "compose the Theseus adapter Spore"
"mycelium:acp-agents" = "compose the ACP-over-HTTP adapter Spore"
"soil:http" = "the ACP adapter reaches its allowlisted endpoint"
"soil:vfs" = "the ACP adapter reads agents/acp.json"

"wasi:cli" = "WASI runtime imports emitted by the component target"
"wasi:clocks" = "WASI runtime imports emitted by the component target"
"wasi:io" = "WASI runtime imports emitted by the component target"

[denied]
"soil:records" = ["the adapter owns the records book"]
host = ["process", "secrets", "environment"]
