[package]
name = "marbles-ui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/fungOS-linux/spores"
publish = false

# Its own workspace, like every Spore guest: the module is built for
# `wasm32-wasip2` on its own profile, not as part of a host tree.
[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
maud = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.41"
