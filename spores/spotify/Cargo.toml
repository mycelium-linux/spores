[package]
name = "spore-spotify"
description = "Spotify Connect remote for RASpotify and other Spotify devices"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cli-http = { path = "../cli-http" }
serde_json = "1"

# The component's own half. These are used only inside the wasm32-wasip2 build
# (src/guest.rs and the wasm-gated half of src/lib.rs), so they are declared for
# that target alone: host clippy was refusing the tree with "unused dependency"
# for code it never compiles.
[target.'cfg(target_family = "wasm")'.dependencies]
serde = { version = "1", features = ["derive"] }
wit-bindgen = "0.57"

[lints.rust]
unsafe_code = "allow"

