# Spore manifest, schema 1. See fungOS-linux/soil docs/spore-package.md.
#
# A grant is a statement of intent reviewed with the pull request, not a
# capability the Spore can widen at runtime.

schema = 1

[spore]
id = "dev.fungos.xplorer"
name = "xplorer"
version = "0.1.0"
license = "MIT"
summary = "Browse the workspace: a grid of files, previewed instantly"
description = "A file manager that draws its own window: an icon grid over one granted workspace, a preview of what is selected, and nothing else."
homepage = "https://github.com/fungOS-linux/spores"

[docs]
usage = ["soil spore run . --surface window --vfs-root DIR"]
man = "docs/man.md"

[catalog]
categories = ["utilities"]
keywords = ["files", "browser", "finder", "preview", "workspace"]
screenshots = [
  { cid = "ipfs://bafkreibbfevon2fmnsit4kov6d43s7cozo2kx2vm4wn75nif7pbovojsyu", caption = "A workspace as a grid, with the selected file previewed beside it" },
  { cid = "ipfs://bafkreibdfn7yfroraeyvj6jdvobntyu5djd23srgwaa4f6fffsyilaff3e", caption = "The same listing in the light theme" },
]
record = "ipfs://bafkreifdc3z5t3nde25x5sglkq3dokodohkw2xcn7gzqs2acmjjhqywgua"

[engine]
soil = ">=0.1"
target = "wasm32-wasip2"
abi = { present = "0.1.0", vfs = "1.0.0", git = "0.1.0", desktops = "0.1.0", vfs-mut = "0.1.0" }

# A Rust module that draws its own frame is the host's default presentation, so
# this package declares no `[[surfaces]]`: a `canvas` view or a `web` page is for
# a Lua view or a page, and neither is what this is.
[module]
path = "module.wasm"

[launch]
default = "native"
surfaces = ["native"]

[grants]
"soil:vfs" = "list one granted workspace and read bounded previews of its files"
"soil:vfs-mut" = "create a file or a folder in the granted workspace. The interface is all-or-nothing: this manifest also hands over remove, rename and chmod, which the window does not call — a browser that can create has to be reviewed as one that can delete"
"soil:git" = "read the branch, commit and change count of the repository the workspace is in; no remote URL, no commit message, no host path"
"soil:desktops" = "list the Desktops this machine registers and rebind this window to another one; no host path is returned"
"soil:present" = "draw the window: an offscreen surface, keyboard input and the cursor"
"wasi:webgpu" = "one offscreen WebGPU device and queue; the host keeps the adapter, the surface and the swap"

[denied]
# The finder creates, and that is the whole of what it does with a mutation
# grant. `remove`, `rename` and `chmod` arrive with the interface whether or not
# the window calls them, which is stated in the grant itself.
host = ["process", "secrets", "environment", "raw-filesystem", "clock"]
transport = ["socket", "quic", "iroh"]

[presentation]
badge = "X"
color = "#7fb2a8"
mark = "assets/icon.svg"
icon = "ipfs://bafkreibee3jr7rxafsww3hd56mi2punqdzb3x3wjcdrhc7sgedwllcxcxu"
